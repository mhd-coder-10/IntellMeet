apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: intellmeet
  labels:
    app.kubernetes.io/name: intellmeet
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app: intellmeet-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
