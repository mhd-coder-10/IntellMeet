apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intellmeet.fullname" . }}-config
  namespace: {{ .Values.namespace | default "intellmeet" }}
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  CLIENT_URL: {{ .Values.config.clientUrl | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  CLOUDINARY_FOLDER: {{ .Values.config.cloudinaryFolder | quote }}
  JWT_ACCESS_TOKEN_EXPIRY: {{ .Values.config.jwtAccessTokenExpiry | quote }}
  JWT_REFERESH_TOKEN_EXPIRY: {{ .Values.config.jwtRefreshTokenExpiry | quote }}
  SMTP_SERVICE: {{ .Values.config.smtpService | quote }}
  EMAIL_FROM: {{ .Values.config.emailFrom | quote }}
