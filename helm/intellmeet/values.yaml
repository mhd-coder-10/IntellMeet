
# IntellMeet Helm Chart - Default Values Configuration
namespace: intellmeet


# Backend Service Configuration
backend:
  replicaCount: 2
  image:
    repository: intellmeet-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5100
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

# Frontend Service Configuration
frontend:
  replicaCount: 2
  image:
    repository: intellmeet-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70


# Redis Cache Configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Ingress Controller Configuration
ingress:
  enabled: true
  className: nginx
  host: intellmeet.local
  tls:
    enabled: false
    secretName: intellmeet-tls


# Application Environment Variables
config:
  nodeEnv: production
  port: "5100"
  clientUrl: "http://localhost:5173"
  redisHost: "redis-service"
  redisPort: "6379"
  cloudinaryFolder: "IntellMeet_AI_Powered_Meeting"
  jwtAccessTokenExpiry: "7d"
  jwtRefreshTokenExpiry: "15m"
  smtpService: "gmail"
  emailFrom: '"IntellMeet" <intellmeett16@gmail.com>'


# Sensitive Secrets (Production credentials - replace with real secrets or inject via CI/CD)
secrets:
  mongoUri: "mongodb+srv://<username>:<password>@cluster.mongodb.net/intellmeet"
  jwtSecret: "your_jwt_secret_key_minimum_32_characters_here"
  jwtRefreshSecret: "your_jwt_refresh_secret_key_minimum_32_characters_here"
  cloudinaryCloudName: "your_cloudinary_cloud_name"
  cloudinaryApiKey: "your_cloudinary_api_key"
  cloudinaryApiSecret: "your_cloudinary_api_secret"
  geminiApiKey: "your_gemini_api_key_here"
  smtpUser: "your_smtp_email@gmail.com"
  smtpPass: "your_smtp_app_password"


