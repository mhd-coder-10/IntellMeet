# Prometheus Configuration for IntellMeet Observability
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "intellmeet-backend"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["backend:5100", "host.docker.internal:5100", "localhost:5100"]
        labels:
          app: "intellmeet"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "intellmeet-live-render"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets: ["intellmeet-backend-hlpy.onrender.com"]
        labels:
          app: "intellmeet"
          environment: "production-live"

