<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- IntellMeet Signature Brand Gradient -->
    <linearGradient id="intellmeet-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="intellmeet-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base matching Header Logo -->
  <rect width="64" height="64" rx="16" fill="url(#intellmeet-grad)" filter="url(#intellmeet-shadow)"/>

  <!-- Crisp White Video Camera Glyph (Lucide Video Geometry) -->
  <g transform="translate(8, 8) scale(2)" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="13" height="12" rx="2.5"/>
    <polygon points="22 7 16 11 16 13 22 17"/>
  </g>
</svg>