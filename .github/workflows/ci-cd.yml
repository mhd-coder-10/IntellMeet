
name: IntellMeet CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'CI-CD-Pipline'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Backend CI (Tests & Syntax Validation)
  backend-ci:
    name: Backend CI (Node 20 & Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Syntax & Tests
        run: npm test

  # Stage 2: Frontend CI (TypeScript & Vite Production Build)
  frontend-ci:
    name: Frontend CI (TypeScript & Vite Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify TypeScript & Build Vite SPA
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:5100/api' }}

  # Stage 3: Docker Images Build & Push to Docker Hub
  docker-build-push:
    name: Docker Build & Push to Docker Hub
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # When main branch is pushed, then log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend image build & push
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/intellmeet-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/intellmeet-backend:${{ github.sha }}

      # Frontend image (SPA + Nginx) build & push
      - name: Build and Push Frontend Image (Nginx)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/intellmeet-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/intellmeet-frontend:${{ github.sha }}

  # Stage 4: CD Deployment Trigger (Render Backend + Vercel Frontend)
  deploy:
    name: Continuous Deployment (Render & Vercel)
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Deployment on Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render Deploy Hook for Backend..."
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render deployment successfully triggered!"
          else
            echo "ℹ RENDER_DEPLOY_HOOK_URL secret not set. Skipping automated Render webhook trigger."
          fi

      - name: Trigger Frontend Deployment on Vercel
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Vercel Deploy Hook for Frontend..."
            curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
            echo "Vercel deployment successfully triggered!"
          else
            echo "ℹ VERCEL_DEPLOY_HOOK_URL secret not set. Skipping automated Vercel webhook trigger."
          fi
